<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url(Img\download.jpg);
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-container {
      background: #5c8cb4;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .login-container input[type="text"],
    .login-container input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007BFF;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
   button:hover {
      background: #063538;
    }
    a{
      text-decoration: none;
      color: aqua;
    }
    .create{
      text-align:center;
      margin-left: 10px;
    }
    .nav-links {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    <form action="Herve.html">
      <label for="email">Email or Username</label>
      <input type="text" id="email" name="email" placeholder="Example@gmail.com or Username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="..........." required>

      <div class="nav-links">
        <a href="" class="create">forgot password?</a>
        <a href="" class="create">Create account</a>
  </div>
      <a href="message.html">
        <button type="submit">Login</button>
      </a>
      <p style="text-align:center; margin-top:10px;">
        <a href="ConnectIn.html" style="color: aqua;">Back to Home</a>
      </p>
    </form>
  </div>

  <script>
    document.querySelector('form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if (email && password) {
        localStorage.setItem('studentLoggedIn', 'true');
        localStorage.setItem('studentEmail', email);
        localStorage.setItem('studentName', email.split('@')[0]);
        
        const redirect = localStorage.getItem('redirectAfterLogin');
        if (redirect === 'contact') {
          localStorage.removeItem('redirectAfterLogin');
          window.location.href = 'ConnectIn.html#Contact';
        } else {
          window.location.href = 'Home.html';
        }
      } else {
        alert('Please fill in all fields');
      }
    });
  </script>
</body>
</html>
