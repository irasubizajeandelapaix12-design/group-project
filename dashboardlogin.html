<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Portal</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border: #d1d5db;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      background-color: var(--bg-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background: var(--bg-card);
      width: 100%;
      max-width: 400px;
      padding: 40px 32px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .auth-header { text-align: center; margin-bottom: 28px; }
    .auth-header h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: var(--text-main); letter-spacing: -0.025em; }
    .auth-header p { font-size: 0.875rem; color: var(--text-muted); line-height: 1.4; }

    .field { margin-bottom: 18px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
    
    input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .submit-btn {
      width: 100%;
      height: 46px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.938rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }

    .submit-btn:hover { background-color: var(--primary-hover); }
    .submit-btn:active { transform: scale(0.985); }

    /* Footer Navigation */
    .footer-nav {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      font-size: 0.875rem;
    }

    .nav-item { color: var(--text-muted); text-align: center; }
    
    .link-btn {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      font-size: 0.875rem;
      padding: 0;
    }

    .link-btn:hover { text-decoration: underline; }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="auth-card">
  <header class="auth-header">
    <h2 id="ui-title">Sign In</h2>
    <p id="ui-subtitle">Access your account to manage your workspace.</p>
  </header>
  
  <form id="authForm" novalidate>
    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="name@company.com" required>
    </div>

    <div class="field" id="password-wrapper">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>

    <div class="field hidden" id="confirm-wrapper">
      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" placeholder="••••••••">
    </div>

    <button type="submit" class="submit-btn" id="submit-btn-text">Sign In</button>
  </form>

  <nav class="footer-nav">
    <div class="nav-item" id="mode-container">
      <span id="mode-text">New here?</span>
      <button class="link-btn" id="btn-mode">Create account</button>
    </div>
    
    <button class="link-btn" id="btn-forgot">Forgot password?</button>
  </nav>
</div>

<script>
  const uiTitle = document.getElementById('ui-title');
  const uiSubtitle = document.getElementById('ui-subtitle');
  const passWrapper = document.getElementById('password-wrapper');
  const confirmWrapper = document.getElementById('confirm-wrapper');
  const submitBtn = document.getElementById('submit-btn-text');
  
  const modeContainer = document.getElementById('mode-container');
  const modeText = document.getElementById('mode-text');
  const btnMode = document.getElementById('btn-mode');
  const btnForgot = document.getElementById('btn-forgot');

  // Modes: 'login', 'signup', 'forgot'
  let state = 'login';

  function updateUI(newState) {
    state = newState;

    // Reset Inputs and Visibility
    passWrapper.classList.remove('hidden');
    confirmWrapper.classList.add('hidden');
    modeContainer.classList.remove('hidden');
    document.getElementById('password').required = true;
    document.getElementById('confirm-password').required = false;

    if (state === 'login') {
      uiTitle.innerText = "Sign In";
      uiSubtitle.innerText = "Access your account to manage your workspace.";
      submitBtn.innerText = "Sign In";
      modeText.innerText = "New here?";
      btnMode.innerText = "Create account";
      btnForgot.innerText = "Forgot password?";
    } 
    else if (state === 'signup') {
      uiTitle.innerText = "Join Us";
      uiSubtitle.innerText = "Create a secure password for your new profile.";
      submitBtn.innerText = "Register";
      modeText.innerText = "Already have an account?";
      btnMode.innerText = "Sign in";
      confirmWrapper.classList.remove('hidden');
      document.getElementById('confirm-password').required = true;
      btnForgot.innerText = "Forgot password?";
    } 
    else if (state === 'forgot') {
      uiTitle.innerText = "Password Reset";
      uiSubtitle.innerText = "We'll send a recovery link to your inbox.";
      submitBtn.innerText = "Send Reset Link";
      passWrapper.classList.add('hidden');
      modeContainer.classList.add('hidden');
      btnForgot.innerText = "Back to Sign In";
      document.getElementById('password').required = false;
    }
  }

  // Event Listeners for accurate switching
  btnMode.addEventListener('click', () => {
    updateUI(state === 'signup' ? 'login' : 'signup');
  });

  btnForgot.addEventListener('click', () => {
    updateUI(state === 'forgot' ? 'login' : 'forgot');
  });

  document.getElementById('authForm').addEventListener('submit', (e) => {
    e.preventDefault();
    // Logic for matching passwords on signup
    if (state === 'signup') {
        const p = document.getElementById('password').value;
        const cp = document.getElementById('confirm-password').value;
        if(p !== cp) return alert("Passwords do not match!");
    }
    alert(`Submitting: ${state} request`);
  });
</script>

</body>
</html>
